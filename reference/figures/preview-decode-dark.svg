<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 656 312" role="img" aria-labelledby="t d">
  <title id="t">Two ways to open a link</title>
  <desc id="d">One link, two operations: preview_webr_link inspects the files in memory without writing anything, while decode_webr_link extracts them to a directory on disk.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.lbl{letter-spacing:.10em;font-weight:700}.fn{fill:#60a5fa}.str{fill:#34d399}.num{fill:#fbbf24}.com{fill:#64748b}.key{fill:#c4b5fd}.ink{fill:#e2e8f0}.body{fill:#cbd5e1}.muted{fill:#94a3b8}.faint{fill:#64748b}.card{fill:#1e293b}.cardline{fill:#334155}.rail{fill:#475569}.accent{fill:#4C9AFF}.accent_soft{fill:#12315c}.hollow{fill:#475569}.chrome{fill:#172033}.pane{fill:#0b1220}.panehdr{fill:#131c2e}.base{fill:#94a3b8}.base_bg{fill:#273244}.ver{fill:#5eead4}.ver_bg{fill:#12332e}.pan{fill:#c4b5fd}.pan_bg{fill:#2e2450}.frag{fill:#4C9AFF}.frag_bg{fill:#12315c}.flag{fill:#fbbf24}.flag_bg{fill:#3d2f10}</style>
  <text class="s lbl muted" x="24" y="54" font-size="11">ONE LINK</text>
  <rect x="24" y="66" width="232" height="108" rx="8" fill="#1e293b" stroke="#334155"/>
  <text class="m muted" x="40" y="96" font-size="12">webr.r-wasm.org/…</text>
  <text class="m" x="40" y="120" font-size="12" xml:space="preserve"><tspan class="frag">#code=eJyLrlbKS8xN…</tspan></text>
  <text class="m" x="40" y="140" font-size="12" xml:space="preserve"><tspan class="frag">Kk4uyiw…</tspan><tspan class="flag">&amp;jz</tspan></text>
  <text class="s faint" x="40" y="162" font-size="11">the files live in here</text>
  <path d="M256 120.0 H294.0 V88.0 H324" fill="none" stroke="#4C9AFF" stroke-width="2"/>
  <path d="M324 83.5 L332 88.0 L324 92.5 z" fill="#4C9AFF"/>
  <text class="s lbl muted" x="332" y="28" font-size="11">PREVIEW: LOOK, DON'T TOUCH</text>
  <rect x="332" y="40" width="300" height="96" rx="8" fill="#1e293b" stroke="#334155"/>
  <text class="m" x="348" y="70" font-size="13" xml:space="preserve"><tspan class="fn">preview_webr_link</tspan><tspan class="ink">(url)</tspan></text>
  <text class="s body" x="348" y="95" font-size="12">2 files</text>
  <text class="m muted" x="406" y="95" font-size="11">plot.R · notes.md · 312 B</text>
  <rect x="348" y="106" width="217" height="19" rx="9.5" fill="#12315c"/>
  <text class="s accent" x="456.3" y="119.5" font-size="10" font-weight="600" text-anchor="middle">in memory: nothing written to disk</text>
  <path d="M256 120.0 H294.0 V218.0 H324" fill="none" stroke="#4C9AFF" stroke-width="2"/>
  <path d="M324 213.5 L332 218.0 L324 222.5 z" fill="#4C9AFF"/>
  <text class="s lbl muted" x="332" y="158" font-size="11">DECODE: WRITE THE FILES OUT</text>
  <rect x="332" y="170" width="300" height="96" rx="8" fill="#1e293b" stroke="#334155"/>
  <text class="m" x="348" y="200" font-size="13" xml:space="preserve"><tspan class="fn">decode_webr_link</tspan><tspan class="ink">(url, output_dir)</tspan></text>
  <path d="M350 235 V216 H362 L367 224 H376 V235 Z" fill="#1e293b" stroke="#4C9AFF" stroke-width="1.3" stroke-linejoin="round"/>
  <text class="m body" x="386" y="230" font-size="11">recovered/</text>
  <text class="m muted" x="386" y="247" font-size="10.5">plot.R  notes.R</text>
  <rect x="511" y="228" width="104" height="19" rx="9.5" fill="#12332e"/>
  <text class="s ver" x="563.25" y="241.5" font-size="10" font-weight="600" text-anchor="middle">written to disk</text>
  <text class="s faint" x="24" y="298" font-size="12">Preview inspects a link in memory and writes nothing; decode extracts its files to disk.</text>
</svg>
