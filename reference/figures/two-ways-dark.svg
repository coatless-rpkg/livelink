  <path d="M270 90 V132" stroke="#475569" stroke-width="2"/>
  <circle cx="270" cy="90" r="9" fill="#12315c" stroke="#4C9AFF" stroke-width="1.2"/>
  <text class="s accent" x="270" y="93.5" font-size="10" font-weight="700" text-anchor="middle">1</text>
  <text class="s body" x="290" y="94" font-size="11">Install R</text>
  <circle cx="270" cy="111" r="9" fill="#12315c" stroke="#4C9AFF" stroke-width="1.2"/>
