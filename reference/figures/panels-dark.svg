<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 184" role="img" aria-labelledby="t d">
  <title id="t">Which webR panels each call shows</title>
  <desc id="d">Three webR windows side by side. panels = c("editor", "plot") lights the editor and plot quadrants; panels = "editor" lights only the editor; panels = NULL lights all four.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.lbl{letter-spacing:.10em;font-weight:700}.fn{fill:#60a5fa}.str{fill:#34d399}.num{fill:#fbbf24}.com{fill:#64748b}.key{fill:#c4b5fd}.ink{fill:#e2e8f0}.body{fill:#cbd5e1}.muted{fill:#94a3b8}.faint{fill:#64748b}.card{fill:#1e293b}.cardline{fill:#334155}.rail{fill:#475569}.accent{fill:#4C9AFF}.accent_soft{fill:#12315c}.hollow{fill:#475569}.chrome{fill:#172033}.pane{fill:#0b1220}.panehdr{fill:#131c2e}.base{fill:#94a3b8}.base_bg{fill:#273244}.ver{fill:#5eead4}.ver_bg{fill:#12332e}.pan{fill:#c4b5fd}.pan_bg{fill:#2e2450}.frag{fill:#4C9AFF}.frag_bg{fill:#12315c}.flag{fill:#fbbf24}.flag_bg{fill:#3d2f10}.shadow{fill:#000000}</style>
  <text class="m muted" x="24" y="22" font-size="11.5">panels =</text>
  <text class="m" x="86" y="22" font-size="11.5" xml:space="preserve"><tspan class="fn">c</tspan><tspan class="ink">(</tspan><tspan class="str">"editor"</tspan><tspan class="ink">, </tspan><tspan class="str">"plot"</tspan><tspan class="ink">)</tspan></text>
  <rect x="24" y="36" width="254" height="86" rx="8" fill="#172033" stroke="#334155"/>
  <path d="M24 52 h254" stroke="#334155"/>
  <circle cx="34" cy="44" r="2.2" fill="#475569"/>
  <circle cx="42" cy="44" r="2.2" fill="#475569"/>
  <circle cx="50" cy="44" r="2.2" fill="#475569"/>
  <rect x="30.0" y="58.0" width="118.0" height="29.0" rx="4" fill="#12315c" stroke="#4C9AFF" stroke-dasharray=""/>
  <text class="m accent" x="89.0" y="75.5" font-size="9" font-weight="700" text-anchor="middle">editor</text>
  <rect x="154.0" y="58.0" width="118.0" height="29.0" rx="4" fill="#0b1220" stroke="#334155" stroke-dasharray="3 3"/>
  <text class="m faint" x="213.0" y="75.5" font-size="9" text-anchor="middle">files</text>
  <rect x="30.0" y="89.0" width="118.0" height="29.0" rx="4" fill="#0b1220" stroke="#334155" stroke-dasharray="3 3"/>
  <text class="m faint" x="89.0" y="106.5" font-size="9" text-anchor="middle">terminal</text>
  <rect x="154.0" y="89.0" width="118.0" height="29.0" rx="4" fill="#12315c" stroke="#4C9AFF" stroke-dasharray=""/>
  <text class="m accent" x="213.0" y="106.5" font-size="9" font-weight="700" text-anchor="middle">plot</text>
  <text class="m muted" x="24" y="144" font-size="11.5">?mode='editor-plot'</text>
  <text class="m muted" x="308" y="22" font-size="11.5">panels =</text>
  <text class="m" x="370" y="22" font-size="11.5" xml:space="preserve"><tspan class="str">"editor"</tspan></text>
  <rect x="308" y="36" width="254" height="86" rx="8" fill="#172033" stroke="#334155"/>
  <path d="M308 52 h254" stroke="#334155"/>
  <circle cx="318" cy="44" r="2.2" fill="#475569"/>
  <circle cx="326" cy="44" r="2.2" fill="#475569"/>
  <circle cx="334" cy="44" r="2.2" fill="#475569"/>
  <rect x="314.0" y="58.0" width="118.0" height="29.0" rx="4" fill="#12315c" stroke="#4C9AFF" stroke-dasharray=""/>
  <text class="m accent" x="373.0" y="75.5" font-size="9" font-weight="700" text-anchor="middle">editor</text>
  <rect x="438.0" y="58.0" width="118.0" height="29.0" rx="4" fill="#0b1220" stroke="#334155" stroke-dasharray="3 3"/>
  <text class="m faint" x="497.0" y="75.5" font-size="9" text-anchor="middle">files</text>
  <rect x="314.0" y="89.0" width="118.0" height="29.0" rx="4" fill="#0b1220" stroke="#334155" stroke-dasharray="3 3"/>
