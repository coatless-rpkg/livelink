  <path d="M610.0 84 l4 8 h-8 z" fill="none" stroke="#b45309" stroke-width="1.2" stroke-linejoin="round"/>
  <text class="s flag" x="610.0" y="91.5" font-size="7" font-weight="800" text-anchor="middle">!</text>
  <text class="s flag" x="626.0" y="93" font-size="8" font-weight="600">error</text>
  <path d="M579.0 117 h92 l-9 -6 h-74 z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M614.0 114 h22" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <text class="s muted" x="625.0" y="134" font-size="10.5" text-anchor="middle">runs, if it installs</text>
  <text class="s faint" x="625.0" y="148" font-size="9.5" text-anchor="middle">and only if it compiles</text>
  <text class="s faint" x="42" y="177" font-size="11.5">Minutes of setup, on a machine you cannot see, and it may still fail.</text>
  <text class="s lbl muted" x="42" y="200" font-size="10.5">SEND A LINK</text>
  <rect x="40" y="214" width="168" height="100" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
