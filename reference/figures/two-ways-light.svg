  <text class="m body" x="84" y="120" font-size="10.5">data.csv</text>
  <path d="M69 132 h9" stroke="#94a3b8" stroke-width="1.1"/>
  <text class="m body" x="84" y="136" font-size="10.5">utils.R</text>
