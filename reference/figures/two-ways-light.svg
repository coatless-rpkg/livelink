  <rect x="588.0" y="67" width="74" height="44" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="593.0" y="72" width="64" height="34" rx="2" fill="#f1f5f9"/>
