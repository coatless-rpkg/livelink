  <rect x="240" y="54" width="250" height="100" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <rect x="250" y="64" width="230" height="80" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="392" y="70" width="84" height="22" rx="11" fill="#fdeccd"/>
