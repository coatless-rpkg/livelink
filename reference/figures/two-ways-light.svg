<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="t d">
  <title id="t">Two ways to share R code</title>
  <desc id="d">The old way sends setup instructions and leaves the runtime on the recipient's machine, slow and uncertain. The new way sends one link that runs in their browser at once.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.lbl{letter-spacing:.10em;font-weight:700}.fn{fill:#2563eb}.str{fill:#047857}.num{fill:#b45309}.com{fill:#94a3b8}.key{fill:#6d28d9}.ink{fill:#0f172a}.body{fill:#334155}.muted{fill:#64748b}.faint{fill:#94a3b8}.card{fill:#f1f5f9}.cardline{fill:#e2e8f0}.rail{fill:#cbd5e1}.accent{fill:#0054AD}.accent_soft{fill:#e0edff}.hollow{fill:#cbd5e1}.chrome{fill:#e2e8f0}.pane{fill:#ffffff}.panehdr{fill:#f8fafc}.base{fill:#475569}.base_bg{fill:#e9edf2}.ver{fill:#0f766e}.ver_bg{fill:#d8f1ee}.pan{fill:#6d28d9}.pan_bg{fill:#ebe3fb}.frag{fill:#0054AD}.frag_bg{fill:#dfeaff}.flag{fill:#b45309}.flag_bg{fill:#fdeccd}.shadow{fill:#1e293b}</style>
  <defs><marker id="tw" markerWidth="9" markerHeight="9" refX="5.4" refY="4" orient="auto"><path d="M1.5 1.6 L5.5 4 L1.5 6.4" fill="none" stroke="#cbd5e1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="twa" markerWidth="9" markerHeight="9" refX="5.4" refY="4" orient="auto"><path d="M1.5 1.6 L5.5 4 L1.5 6.4" fill="none" stroke="#0054AD" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <text class="s lbl muted" x="42" y="40" font-size="10.5">SEND THE INSTRUCTIONS</text>
