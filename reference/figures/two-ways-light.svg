  <rect x="258" y="230" width="214" height="26" rx="13" fill="#ffffff" stroke="#0054AD" stroke-width="1.2"/>
  <rect x="272" y="239" width="9" height="7" rx="1.6" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <path d="M273.7 239 v-2 a2.9 2.9 0 0 1 5.6 0 v2" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <text class="m faint" x="290" y="247" font-size="11">webr.r-wasm.org/latest/</text>
  <text class="m" x="262" y="276" font-size="11.5" xml:space="preserve"><tspan class="frag">#code=eJyLrlbKS8xN…</tspan><tspan class="flag">&amp;jz</tspan></text>
  <path d="M264 290 l0 13 l3.4 -3.4 l2.4 5 l2 -1 l-2.4 -5 l5 0 z" fill="#0054AD"/>
  <text class="s accent" x="282" y="300" font-size="11" font-weight="600">one click to run</text>
  <rect x="416" y="290" width="62" height="20" rx="10" fill="#e0edff"/>
