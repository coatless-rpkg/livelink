  <path d="M429 296.6 V300 h2.6" fill="none" stroke="#0054AD" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="s accent" x="440" y="304" font-size="10.5" font-weight="700">~30s</text>
  <path d="M496 264.0 H522" stroke="#0054AD" stroke-width="1.9" stroke-linecap="round" marker-end="url(#twa)"/>
