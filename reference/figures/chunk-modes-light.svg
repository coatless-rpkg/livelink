<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 431" role="img" aria-labelledby="t d">
  <title id="t">The chunk hook and the chunk engine</title>
  <desc id="d">With the hook on an ordinary r chunk, the chunk still runs and its plot appears in the page, with a link beneath. With the engine, the code is shown but never executed, and only a link is produced.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.lbl{letter-spacing:.10em;font-weight:700}.fn{fill:#2563eb}.str{fill:#047857}.num{fill:#b45309}.com{fill:#94a3b8}.key{fill:#6d28d9}.ink{fill:#0f172a}.body{fill:#334155}.muted{fill:#64748b}.faint{fill:#94a3b8}.card{fill:#f1f5f9}.cardline{fill:#e2e8f0}.rail{fill:#cbd5e1}.accent{fill:#0054AD}.accent_soft{fill:#e0edff}.hollow{fill:#cbd5e1}.chrome{fill:#e2e8f0}.pane{fill:#ffffff}.panehdr{fill:#f8fafc}.base{fill:#475569}.base_bg{fill:#e9edf2}.ver{fill:#0f766e}.ver_bg{fill:#d8f1ee}.pan{fill:#6d28d9}.pan_bg{fill:#ebe3fb}.frag{fill:#0054AD}.frag_bg{fill:#dfeaff}.flag{fill:#b45309}.flag_bg{fill:#fdeccd}.shadow{fill:#1e293b}</style>
  <text class="s lbl ink" x="27.0" y="26" font-size="13">THE HOOK</text>
  <rect x="27.0" y="44" width="378" height="146" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M27.0 44 h378 v22 h-378 z" fill="#f8fafc"/>
  <path d="M27.0 66 h378" stroke="#e2e8f0"/>
  <text class="m accent" x="35.0" y="59" font-size="9.5" font-weight="700">notes.qmd</text>
  <rect x="41.0" y="78" width="350" height="102" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="m" x="55.0" y="98" font-size="12" xml:space="preserve"><tspan class="fn">```{r}</tspan></text>
  <text class="m" x="55.0" y="116" font-size="12" xml:space="preserve"><tspan class="com">#| livelink: true</tspan></text>
  <text class="m" x="55.0" y="134" font-size="12" xml:space="preserve"><tspan class="fn">data</tspan><tspan class="ink">(mtcars)</tspan></text>
  <text class="m" x="55.0" y="152" font-size="12" xml:space="preserve"><tspan class="fn">plot</tspan><tspan class="ink">(mtcars$mpg, mtcars$wt)</tspan></text>
  <text class="m" x="55.0" y="170" font-size="12" xml:space="preserve"><tspan class="fn">```</tspan></text>
  <text class="s lbl muted" x="27.0" y="218" font-size="11">IN THE PAGE</text>
  <rect x="27.0" y="228" width="378" height="187" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M27.0 228 h378 v22 h-378 z" fill="#f8fafc"/>
  <path d="M27.0 250 h378" stroke="#e2e8f0"/>
  <text class="m accent" x="35.0" y="243" font-size="9.5" font-weight="700">rendered</text>
  <rect x="41.0" y="262" width="350" height="48" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
