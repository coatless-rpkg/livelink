  <text class="s lbl ink" x="445.0" y="26" font-size="13">THE ENGINE</text>
  <rect x="445.0" y="44" width="378" height="146" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M445.0 44 h378 v22 h-378 z" fill="#f8fafc"/>
