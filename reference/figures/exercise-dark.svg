<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 278" role="img" aria-labelledby="t d">
  <title id="t">An exercise and its solution</title>
  <desc id="d">One call to webr_repl_exercise returns two links. The exercise link carries the jz flags and waits; the solution link carries jza and runs itself on arrival.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.lbl{letter-spacing:.10em;font-weight:700}.fn{fill:#60a5fa}.str{fill:#34d399}.num{fill:#fbbf24}.com{fill:#64748b}.key{fill:#c4b5fd}.ink{fill:#e2e8f0}.body{fill:#cbd5e1}.muted{fill:#94a3b8}.faint{fill:#64748b}.card{fill:#1e293b}.cardline{fill:#334155}.rail{fill:#475569}.accent{fill:#4C9AFF}.accent_soft{fill:#12315c}.hollow{fill:#475569}.chrome{fill:#172033}.pane{fill:#0b1220}.panehdr{fill:#131c2e}.base{fill:#94a3b8}.base_bg{fill:#273244}.ver{fill:#5eead4}.ver_bg{fill:#12332e}.pan{fill:#c4b5fd}.pan_bg{fill:#2e2450}.frag{fill:#4C9AFF}.frag_bg{fill:#12315c}.flag{fill:#fbbf24}.flag_bg{fill:#3d2f10}.shadow{fill:#000000}</style>
  <text class="s lbl muted" x="24" y="22" font-size="11">ONE CALL</text>
  <rect x="24" y="34" width="660" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
  <text class="m" x="40" y="59" font-size="12.5" xml:space="preserve"><tspan class="fn">webr_repl_exercise</tspan><tspan class="ink">(exercise, solution, </tspan><tspan class="str">"mean_mpg"</tspan><tspan class="ink">)</tspan></text>
  <text class="s lbl muted" x="24" y="108" font-size="11">TWO LINKS</text>
  <rect x="24" y="120" width="320" height="68" rx="6" fill="#0b1220" stroke="#334155"/>
  <path d="M24 120 h320 v22 h-320 z" fill="#131c2e"/>
  <path d="M24 142 h320" stroke="#334155"/>
  <text class="m accent" x="32" y="135" font-size="9.5" font-weight="700">mean_mpg_exercise.R</text>
  <rect x="292.0" y="124" width="42.0" height="15" rx="7.5" fill="#273244"/>
  <text class="m base" x="313.0" y="135" font-size="9" text-anchor="middle">waits</text>
  <text class="m" x="36" y="162" font-size="11.5" xml:space="preserve"><tspan class="ink">mean_mpg </tspan><tspan class="ink">&lt;- </tspan><tspan class="num">0</tspan></text>
  <text class="m" x="36" y="177" font-size="11.5" xml:space="preserve"><tspan class="fn">print</tspan><tspan class="ink">(mean_mpg)</tspan></text>
  <path d="M184.0 188 V201" stroke="#4C9AFF" stroke-width="1.5"/>
  <path d="M180.0 201 L184.0 208 L188.0 201 z" fill="#4C9AFF"/>
  <rect x="24" y="208" width="320" height="28" rx="8" fill="#0b1220" stroke="#334155"/>
  <circle cx="41" cy="222.0" r="8" fill="#12315c"/>
  <path d="M38 225.0 L44 219.0 M41 219.0 h3 v3" stroke="#4C9AFF" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="m" x="57" y="225.5" font-size="10.5" xml:space="preserve"><tspan class="ink">webr.r-wasm.org/…#code=</tspan><tspan class="frag">eJyLrlbKS8…</tspan><tspan class="flag">&amp;jz</tspan></text>
  <rect x="364" y="120" width="320" height="68" rx="6" fill="#0b1220" stroke="#334155"/>
  <path d="M364 120 h320 v22 h-320 z" fill="#131c2e"/>
  <path d="M364 142 h320" stroke="#334155"/>
  <text class="m accent" x="372" y="135" font-size="9.5" font-weight="700">mean_mpg_solution.R</text>
  <rect x="612.8" y="124" width="61.2" height="15" rx="7.5" fill="#3d2f10"/>
  <text class="m flag" x="643.4" y="135" font-size="9" text-anchor="middle">autoruns</text>
  <text class="m" x="376" y="162" font-size="11.5" xml:space="preserve"><tspan class="ink">mean_mpg </tspan><tspan class="ink">&lt;- </tspan><tspan class="fn">mean</tspan><tspan class="ink">(mtcars$mpg)</tspan></text>
  <text class="m" x="376" y="177" font-size="11.5" xml:space="preserve"><tspan class="fn">print</tspan><tspan class="ink">(mean_mpg)</tspan></text>
  <path d="M524.0 188 V201" stroke="#4C9AFF" stroke-width="1.5"/>
  <path d="M520.0 201 L524.0 208 L528.0 201 z" fill="#4C9AFF"/>
  <rect x="364" y="208" width="320" height="28" rx="8" fill="#0b1220" stroke="#334155"/>
  <circle cx="381" cy="222.0" r="8" fill="#12315c"/>
  <path d="M378 225.0 L384 219.0 M381 219.0 h3 v3" stroke="#4C9AFF" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="m" x="397" y="225.5" font-size="10.5" xml:space="preserve"><tspan class="ink">webr.r-wasm.org/…#code=</tspan><tspan class="frag">eJyLrlbKS8…</tspan><tspan class="flag">&amp;jza</tspan></text>
  <text class="s faint" x="24" y="264" font-size="12">The links differ by one flag. The a in jza is autorun: the solution runs itself, the exercise waits.</text>
</svg>
