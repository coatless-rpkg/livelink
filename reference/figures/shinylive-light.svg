  <rect x="246" y="83" width="212" height="18" rx="9" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="328.1" y="85" width="15.4" height="14" rx="3" fill="#e0edff"/>
  <text class="m" x="256" y="97" font-size="9.5" xml:space="preserve"><tspan class="ink">shinylive.io/</tspan><tspan class="accent">py</tspan><tspan class="ink">/editor/#code=…</tspan></text>
  <text class="s faint" x="824" y="97" font-size="11.5" text-anchor="end">a Python app</text>
  <line x1="24" y1="126" x2="826" y2="126" stroke="#e2e8f0"/>
  <text class="s lbl muted" x="24" y="156" font-size="11">THE MODE PICKS WHAT THEY LAND ON</text>
