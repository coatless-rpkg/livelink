  <rect x="246" y="43" width="212" height="18" rx="9" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="328.1" y="45" width="9.7" height="14" rx="3" fill="#e0edff"/>
  <text class="m" x="256" y="57" font-size="9.5" xml:space="preserve"><tspan class="ink">shinylive.io/</tspan><tspan class="accent">r</tspan><tspan class="ink">/editor/#code=…</tspan></text>
  <text class="s faint" x="824" y="57" font-size="11.5" text-anchor="end">an R app</text>
  <text class="m" x="24" y="98" font-size="12.5" xml:space="preserve"><tspan class="fn">shinylive_py_link</tspan><tspan class="ink">()</tspan></text>
