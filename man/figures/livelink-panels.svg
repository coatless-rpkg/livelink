<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 646" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Choosing webR panels with the panels argument</title>
  <desc id="desc">A schematic browser window shows webR's four panels: editor, plot, files and terminal. Three example calls show which panels are lit: panels = c("editor", "plot") lights the editor and plot and dims the rest; panels = "editor" lights the editor only; panels = NULL, the default, lights all four. The chosen panels are hyphen-joined into the URL as ?mode='editor-plot'.</desc>
  <style>
    .s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .plate{fill:#f8fafc;stroke:#e2e8f0}
    .chip{fill:#ffffff;stroke:#e2e8f0}
    .h{fill:#0f172a}
    .b{fill:#334155}
    .mut{fill:#64748b}
    .t-cy{fill:#0e7490}
    .t-am{fill:#b45309}
    .t-bl{fill:#1d4ed8}
    .t-gn{fill:#047857}
    .t-vi{fill:#6d28d9}
    .ring{stroke:#f8fafc}
    .eyebrow{letter-spacing:.14em}
    .rule{stroke:#94a3b8;stroke-opacity:.25}
    .frame{fill:none;stroke:#cbd5e1}
    .bar{fill:#e2e8f0}
    .dot{fill:#94a3b8}
    .off{fill:#94a3b8;fill-opacity:.06;stroke:#94a3b8;stroke-opacity:.35;stroke-dasharray:3 3}
    .offtx{fill:#94a3b8}
    .pill{fill:#ffffff;fill-opacity:.6;stroke:#94a3b8;stroke-opacity:.3}
    @media (prefers-color-scheme: dark){
      .plate{fill:#0f172a;stroke:#1e293b}
      .chip{fill:#1e293b;stroke:#334155}
      .h{fill:#f1f5f9}
      .b{fill:#cbd5e1}
      .mut{fill:#94a3b8}
      .t-cy{fill:#22d3ee}
      .t-am{fill:#fbbf24}
      .t-bl{fill:#60a5fa}
      .t-gn{fill:#34d399}
      .t-vi{fill:#c4b5fd}
      .ring{stroke:#0f172a}
      .frame{stroke:#334155}
      .bar{fill:#334155}
      .dot{fill:#64748b}
      .pill{fill:#0f172a;fill-opacity:.55;stroke:#64748b;stroke-opacity:.5}
      .off{fill:#64748b;fill-opacity:.12;stroke:#64748b;stroke-opacity:.55}
      .offtx{fill:#64748b}
    }
  </style>

  <rect class="plate" x="0.5" y="0.5" width="699" height="645" rx="16"/>

  <!-- masthead -->
  <text class="s eyebrow mut" x="28" y="38" font-size="12" font-weight="600">PICKING THE PANELS</text>
  <text class="m h" x="28" y="66" font-size="17" font-weight="600">webr_repl_link(code, panels = &#8230;)</text>
  <text class="s b" x="28" y="90" font-size="13">webR has four panels. Name the ones you want; the rest never appear.</text>
  <line class="rule" x1="28" y1="104" x2="672" y2="104"/>

  <!-- big browser -->
  <rect class="chip" x="28" y="122" width="644" height="216" rx="10"/>
  <rect class="bar" x="28" y="122" width="644" height="28" rx="10"/>
  <rect class="bar" x="28" y="140" width="644" height="10"/>
  <circle class="dot" cx="46" cy="136" r="3.5"/>
  <circle class="dot" cx="58" cy="136" r="3.5"/>
  <circle class="dot" cx="70" cy="136" r="3.5"/>
  <rect class="pill" x="86" y="128" width="240" height="16" rx="8"/>
  <text class="m mut" x="96" y="140" font-size="12">webr.r-wasm.org/latest/</text>

  <!-- editor -->
  <rect x="42" y="162" width="306" height="78" rx="8" fill="#06b6d4" fill-opacity="0.10" stroke="#0e7490" stroke-opacity="0.45"/>
  <text class="m t-cy" x="56" y="184" font-size="13.5" font-weight="700">editor</text>
  <text class="s mut" x="56" y="203" font-size="12.5">your script, with a Run button</text>
  <line x1="56" y1="216" x2="200" y2="216" stroke="#0e7490" stroke-opacity="0.35" stroke-width="2"/>
  <line x1="56" y1="226" x2="160" y2="226" stroke="#0e7490" stroke-opacity="0.25" stroke-width="2"/>

  <!-- plot -->
  <rect x="358" y="162" width="306" height="78" rx="8" fill="#f59e0b" fill-opacity="0.10" stroke="#b45309" stroke-opacity="0.45"/>
  <text class="m t-am" x="372" y="184" font-size="13.5" font-weight="700">plot</text>
  <text class="s mut" x="372" y="203" font-size="12.5">graphics device output</text>
  <polyline points="372,228 392,218 412,224 432,208 452,214" fill="none" stroke="#b45309" stroke-opacity="0.5" stroke-width="2"/>

  <!-- files -->
  <rect x="42" y="250" width="306" height="76" rx="8" fill="#10b981" fill-opacity="0.10" stroke="#047857" stroke-opacity="0.45"/>
  <text class="m t-gn" x="56" y="272" font-size="13.5" font-weight="700">files</text>
  <text class="s mut" x="56" y="291" font-size="12.5">the virtual filesystem, /home/web_user</text>
  <rect x="56" y="302" width="52" height="10" rx="2" fill="#047857" fill-opacity="0.3"/>
  <rect x="114" y="302" width="70" height="10" rx="2" fill="#047857" fill-opacity="0.2"/>

  <!-- terminal -->
  <rect x="358" y="250" width="306" height="76" rx="8" fill="#3b82f6" fill-opacity="0.10" stroke="#1d4ed8" stroke-opacity="0.45"/>
  <text class="m t-bl" x="372" y="272" font-size="13.5" font-weight="700">terminal</text>
  <text class="s mut" x="372" y="291" font-size="12.5">the live R console</text>
  <text class="m t-bl" x="372" y="311" font-size="12.5" opacity="0.75">&gt; mean(1:10)</text>

  <!-- examples -->
  <text class="s eyebrow mut" x="28" y="368" font-size="12" font-weight="600">THREE CALLS, THREE LAYOUTS</text>

  <!-- example 1 -->
  <g transform="translate(28,382)">
    <text class="m h" x="0" y="14" font-size="12.5" font-weight="600">panels =</text>
    <text class="m t-vi" x="0" y="32" font-size="12.5" font-weight="600">c(&quot;editor&quot;, &quot;plot&quot;)</text>
    <rect class="chip" x="0" y="44" width="200" height="112" rx="8"/>
    <rect class="bar" x="0" y="44" width="200" height="20" rx="8"/>
    <rect class="bar" x="0" y="56" width="200" height="8"/>
    <circle class="dot" cx="12" cy="54" r="2.5"/>
    <circle class="dot" cx="21" cy="54" r="2.5"/>
    <circle class="dot" cx="30" cy="54" r="2.5"/>
    <rect x="12" y="74" width="86" height="34" rx="5" fill="#06b6d4" fill-opacity="0.14" stroke="#0e7490" stroke-opacity="0.5"/>
    <text class="m t-cy" x="55" y="95" font-size="12" font-weight="700" text-anchor="middle">editor</text>
    <rect x="104" y="74" width="84" height="34" rx="5" fill="#f59e0b" fill-opacity="0.14" stroke="#b45309" stroke-opacity="0.5"/>
    <text class="m t-am" x="146" y="95" font-size="12" font-weight="700" text-anchor="middle">plot</text>
    <rect class="off" x="12" y="114" width="86" height="30" rx="5"/>
    <text class="m offtx" x="55" y="133" font-size="12" text-anchor="middle">files</text>
    <rect class="off" x="104" y="114" width="84" height="30" rx="5"/>
    <text class="m offtx" x="146" y="133" font-size="12" text-anchor="middle">terminal</text>
    <text class="s mut" x="0" y="176" font-size="12.5">editor and plot only</text>
    <text class="m mut" x="0" y="194" font-size="12">?mode=&#39;editor-plot&#39;</text>
  </g>

  <!-- example 2 -->
  <g transform="translate(250,382)">
    <text class="m h" x="0" y="14" font-size="12.5" font-weight="600">panels =</text>
    <text class="m t-vi" x="0" y="32" font-size="12.5" font-weight="600">&quot;editor&quot;</text>
    <rect class="chip" x="0" y="44" width="200" height="112" rx="8"/>
    <rect class="bar" x="0" y="44" width="200" height="20" rx="8"/>
    <rect class="bar" x="0" y="56" width="200" height="8"/>
    <circle class="dot" cx="12" cy="54" r="2.5"/>
    <circle class="dot" cx="21" cy="54" r="2.5"/>
    <circle class="dot" cx="30" cy="54" r="2.5"/>
    <rect x="12" y="74" width="176" height="34" rx="5" fill="#06b6d4" fill-opacity="0.14" stroke="#0e7490" stroke-opacity="0.5"/>
    <text class="m t-cy" x="100" y="95" font-size="12" font-weight="700" text-anchor="middle">editor</text>
    <rect class="off" x="12" y="114" width="54" height="30" rx="5"/>
    <text class="m offtx" x="39" y="133" font-size="12" text-anchor="middle">plot</text>
    <rect class="off" x="72" y="114" width="54" height="30" rx="5"/>
    <text class="m offtx" x="99" y="133" font-size="12" text-anchor="middle">files</text>
    <rect class="off" x="132" y="114" width="56" height="30" rx="5"/>
    <text class="m offtx" x="160" y="133" font-size="12" text-anchor="middle">term</text>
    <text class="s mut" x="0" y="176" font-size="12.5">a bare code editor</text>
    <text class="m mut" x="0" y="194" font-size="12">?mode=&#39;editor&#39;</text>
  </g>

  <!-- example 3 -->
  <g transform="translate(472,382)">
    <text class="m h" x="0" y="14" font-size="12.5" font-weight="600">panels =</text>
    <text class="m t-vi" x="0" y="32" font-size="12.5" font-weight="600">NULL &#8212; the default</text>
    <rect class="chip" x="0" y="44" width="200" height="112" rx="8"/>
    <rect class="bar" x="0" y="44" width="200" height="20" rx="8"/>
    <rect class="bar" x="0" y="56" width="200" height="8"/>
    <circle class="dot" cx="12" cy="54" r="2.5"/>
    <circle class="dot" cx="21" cy="54" r="2.5"/>
    <circle class="dot" cx="30" cy="54" r="2.5"/>
    <rect x="12" y="74" width="86" height="34" rx="5" fill="#06b6d4" fill-opacity="0.14" stroke="#0e7490" stroke-opacity="0.5"/>
    <text class="m t-cy" x="55" y="95" font-size="12" font-weight="700" text-anchor="middle">editor</text>
    <rect x="104" y="74" width="84" height="34" rx="5" fill="#f59e0b" fill-opacity="0.14" stroke="#b45309" stroke-opacity="0.5"/>
    <text class="m t-am" x="146" y="95" font-size="12" font-weight="700" text-anchor="middle">plot</text>
    <rect x="12" y="114" width="86" height="30" rx="5" fill="#10b981" fill-opacity="0.14" stroke="#047857" stroke-opacity="0.5"/>
    <text class="m t-gn" x="55" y="133" font-size="12" font-weight="700" text-anchor="middle">files</text>
    <rect x="104" y="114" width="84" height="30" rx="5" fill="#3b82f6" fill-opacity="0.14" stroke="#1d4ed8" stroke-opacity="0.5"/>
    <text class="m t-bl" x="146" y="133" font-size="12" font-weight="700" text-anchor="middle">terminal</text>
    <text class="s mut" x="0" y="176" font-size="12.5">everything webR has</text>
    <text class="m mut" x="0" y="194" font-size="12">no ?mode= at all</text>
  </g>

  <line class="rule" x1="28" y1="600" x2="672" y2="600"/>
  <text class="s mut" x="28" y="620" font-size="12.5">Panel names are hyphen-joined into the query string, so c(&quot;editor&quot;, &quot;plot&quot;) becomes ?mode=&#39;editor-plot&#39;.</text>
  <text class="s mut" x="28" y="638" font-size="12.5">Dimmed panels are simply absent &#8212; webR gives the space to whatever you did ask for.</text>
</svg>
