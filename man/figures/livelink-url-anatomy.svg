<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 690" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Anatomy of a webR sharelink</title>
  <desc id="desc">A real webR URL split into five labelled parts: the base address https://webr.r-wasm.org/, the version latest/, the panel selection ?mode='editor-plot', the fragment #code= holding the gzipped base64 payload, and the trailing flags &amp;jz. A legend explains the flags j for JSON, z for gzip, m for msgpack, u for uncompressed and a for autorun; livelink writes jz, webR's own share button writes mz, and livelink reads both.</desc>
  <style>
    .s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .plate{fill:#f8fafc;stroke:#e2e8f0}
    .chip{fill:#ffffff;stroke:#e2e8f0}
    .h{fill:#0f172a}
    .b{fill:#334155}
    .mut{fill:#64748b}
    .t-cy{fill:#0e7490}
    .t-am{fill:#b45309}
    .t-bl{fill:#1d4ed8}
    .t-gn{fill:#047857}
    .t-vi{fill:#6d28d9}
    .ring{stroke:#f8fafc}
    .eyebrow{letter-spacing:.14em}
    .rule{stroke:#94a3b8;stroke-opacity:.25}
    @media (prefers-color-scheme: dark){
      .plate{fill:#0f172a;stroke:#1e293b}
      .chip{fill:#1e293b;stroke:#334155}
      .h{fill:#f1f5f9}
      .b{fill:#cbd5e1}
      .mut{fill:#94a3b8}
      .t-cy{fill:#22d3ee}
      .t-am{fill:#fbbf24}
      .t-bl{fill:#60a5fa}
      .t-gn{fill:#34d399}
      .t-vi{fill:#c4b5fd}
      .ring{stroke:#0f172a}
    }
  </style>

  <rect class="plate" x="0.5" y="0.5" width="699" height="689" rx="16"/>

  <!-- masthead -->
  <text class="s eyebrow mut" x="28" y="38" font-size="12" font-weight="600">ANATOMY OF A LINK</text>
  <text class="m h" x="28" y="66" font-size="17" font-weight="600">webr_repl_link({ plot(1:10) }, panels = c(&quot;editor&quot;, &quot;plot&quot;))</text>
  <text class="s b" x="28" y="90" font-size="13">Every piece of the URL is doing a job. Here is what that call actually returns.</text>
  <line class="rule" x1="28" y1="104" x2="672" y2="104"/>

  <!-- the URL itself -->
  <rect class="chip" x="28" y="120" width="644" height="88" rx="10"/>
  <text class="m" x="44" y="146" font-size="12.5"><tspan class="b">https://webr.r-wasm.org/</tspan><tspan class="t-gn" font-weight="600">latest/</tspan><tspan class="t-vi" font-weight="600">?mode=&#39;editor-plot&#39;</tspan></text>
  <text class="m" x="44" y="170" font-size="12.5"><tspan class="t-cy" font-weight="600">#code=</tspan><tspan class="mut">eJyLrlbKS8xNVbJSKk4uyiwo0QtS0lEqSCzJAIroZ%2BTnpuqXpybFlxanFu</tspan></text>
  <text class="m" x="44" y="194" font-size="12.5"><tspan class="mut">kjKShJrSgBKijIyS%2FRMLQyNNBUqo0FAJecF%2Fo%3D</tspan><tspan class="t-am" font-weight="600">&amp;jz</tspan></text>

  <!-- the parts -->
  <text class="s eyebrow mut" x="28" y="236" font-size="12" font-weight="600">THE FIVE PARTS</text>

  <!-- 1 base address -->
  <circle cx="34" cy="256" r="4" fill="#64748b" class="ring" stroke-width="2.5"/>
  <text class="m b" x="50" y="261" font-size="13" font-weight="600">https://webr.r-wasm.org/</text>
  <text class="s b" x="672" y="261" font-size="12.5" font-weight="600" text-anchor="end">base address</text>
  <text class="s mut" x="50" y="279" font-size="12.5">Where webR is served from. Point it elsewhere with base_url or livelink.webr_base_url.</text>

  <!-- 2 version -->
  <circle cx="34" cy="303" r="4" fill="#059669" class="ring" stroke-width="2.5"/>
  <text class="m t-gn" x="50" y="308" font-size="13" font-weight="600">latest/</text>
  <text class="s t-gn" x="672" y="308" font-size="12.5" font-weight="600" text-anchor="end">version</text>
  <text class="s mut" x="50" y="326" font-size="12.5">version = &quot;latest&quot; by default; pin a release such as &quot;v0.5.4&quot; to freeze the environment.</text>

  <!-- 3 panels -->
  <circle cx="34" cy="350" r="4" fill="#7c3aed" class="ring" stroke-width="2.5"/>
  <text class="m t-vi" x="50" y="355" font-size="13" font-weight="600">?mode=&#39;editor-plot&#39;</text>
  <text class="s t-vi" x="672" y="355" font-size="12.5" font-weight="600" text-anchor="end">panels</text>
  <text class="s mut" x="50" y="373" font-size="12.5">panels = c(&quot;editor&quot;, &quot;plot&quot;), hyphen-joined. Omit it and webR shows all four panels.</text>

  <!-- 4 fragment -->
  <circle cx="34" cy="397" r="4" fill="#06b6d4" class="ring" stroke-width="2.5"/>
  <text class="m t-cy" x="50" y="402" font-size="13" font-weight="600">#code=&#8230;</text>
  <text class="s t-cy" x="672" y="402" font-size="12.5" font-weight="600" text-anchor="end">the fragment</text>
  <text class="s mut" x="50" y="420" font-size="12.5">Your files as JSON, gzipped, base64&#8217;d, percent-escaped. Fragments never leave the browser.</text>

  <!-- 5 flags -->
  <circle cx="34" cy="444" r="4" fill="#d97706" class="ring" stroke-width="2.5"/>
  <text class="m t-am" x="50" y="449" font-size="13" font-weight="600">&amp;jz</text>
  <text class="s t-am" x="672" y="449" font-size="12.5" font-weight="600" text-anchor="end">flags</text>
  <text class="s mut" x="50" y="467" font-size="12.5">How to read the payload. livelink adds an &quot;a&quot; &#8212; &amp;jza &#8212; when autorun = TRUE.</text>

  <line class="rule" x1="28" y1="491" x2="672" y2="491"/>

  <!-- flag legend -->
  <text class="s eyebrow mut" x="28" y="519" font-size="12" font-weight="600">FLAG LEGEND</text>
  <rect class="chip" x="28" y="531" width="644" height="52" rx="10"/>

  <rect x="44" y="547" width="19" height="20" rx="4" fill="#0e7490" fill-opacity="0.12"/>
  <text class="m t-cy" x="53.5" y="562" font-size="13" font-weight="700" text-anchor="middle">j</text>
  <text class="s b" x="70" y="562" font-size="12.5">JSON</text>

  <rect x="136" y="547" width="19" height="20" rx="4" fill="#b45309" fill-opacity="0.12"/>
  <text class="m t-am" x="145.5" y="562" font-size="13" font-weight="700" text-anchor="middle">z</text>
  <text class="s b" x="162" y="562" font-size="12.5">gzip</text>

  <rect x="222" y="547" width="19" height="20" rx="4" fill="#6d28d9" fill-opacity="0.12"/>
  <text class="m t-vi" x="231.5" y="562" font-size="13" font-weight="700" text-anchor="middle">m</text>
  <text class="s b" x="248" y="562" font-size="12.5">msgpack</text>

  <rect x="342" y="547" width="19" height="20" rx="4" fill="#047857" fill-opacity="0.12"/>
  <text class="m t-gn" x="351.5" y="562" font-size="13" font-weight="700" text-anchor="middle">u</text>
  <text class="s b" x="368" y="562" font-size="12.5">uncompressed</text>

  <rect x="512" y="547" width="19" height="20" rx="4" fill="#1d4ed8" fill-opacity="0.12"/>
  <text class="m t-bl" x="521.5" y="562" font-size="13" font-weight="700" text-anchor="middle">a</text>
  <text class="s b" x="538" y="562" font-size="12.5">autorun</text>

  <!-- dialects -->
  <rect x="28" y="597" width="644" height="46" rx="10" fill="#3b82f6" fill-opacity="0.10" stroke="#3b82f6" stroke-opacity="0.35"/>
  <text class="s h" x="44" y="617" font-size="13" font-weight="600">Two dialects, one reader</text>
  <text class="s mut" x="44" y="635" font-size="12.5">livelink writes <tspan class="m t-am" font-weight="600">jz</tspan> (JSON + gzip). webR&#8217;s share button writes <tspan class="m t-vi" font-weight="600">mz</tspan> (msgpack). livelink decodes both.</text>

  <line class="rule" x1="28" y1="659" x2="672" y2="659"/>
  <text class="s mut" x="28" y="678" font-size="12.5">The whole script travels inside the link &#8212; no gist, no upload, no account.</text>
</svg>
