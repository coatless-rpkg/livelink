  <text class="m" x="473.0" y="282" font-size="12" xml:space="preserve"><tspan class="fn">library</tspan><tspan class="ink">(shiny)</tspan></text>
  <text class="m" x="473.0" y="300" font-size="12" xml:space="preserve"><tspan class="fn">shinyApp</tspan><tspan class="ink">(ui, server)</tspan></text>
