<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 326" role="img" aria-labelledby="t d">
  <title id="t">The chunk hook and the chunk engine</title>
  <desc id="d">A comparison. With the hook, the code runs and its output appears in the page alongside a link. With the engine, the code is shown but not run, and only a link is produced. Both give a link, and both receive the chunk's raw source.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.lbl{letter-spacing:.10em;font-weight:700}.fn{fill:#60a5fa}.str{fill:#34d399}.num{fill:#fbbf24}.com{fill:#64748b}.key{fill:#c4b5fd}.ink{fill:#e2e8f0}.body{fill:#cbd5e1}.muted{fill:#94a3b8}.faint{fill:#64748b}.card{fill:#1e293b}.cardline{fill:#334155}.rail{fill:#475569}.accent{fill:#4C9AFF}.accent_soft{fill:#12315c}.hollow{fill:#475569}.chrome{fill:#172033}.pane{fill:#0b1220}.panehdr{fill:#131c2e}.base{fill:#94a3b8}.base_bg{fill:#273244}.ver{fill:#5eead4}.ver_bg{fill:#12332e}.pan{fill:#c4b5fd}.pan_bg{fill:#2e2450}.frag{fill:#4C9AFF}.frag_bg{fill:#12315c}.flag{fill:#fbbf24}.flag_bg{fill:#3d2f10}</style>
  <text class="s lbl ink" x="470" y="24" font-size="12" text-anchor="middle">THE HOOK</text>
  <text class="m muted" x="470" y="42" font-size="10.5" text-anchor="middle">livelink: true, on an r chunk</text>
  <text class="s lbl ink" x="660" y="24" font-size="12" text-anchor="middle">THE ENGINE</text>
  <text class="m muted" x="660" y="42" font-size="10.5" text-anchor="middle">a livelink chunk</text>
  <rect x="24" y="57" width="802" height="34" rx="6" fill="#1e293b"/>
  <text class="s body" x="44" y="80" font-size="13.5">the code runs</text>
  <circle cx="470" cy="76" r="7" fill="#4C9AFF"/>
  <circle cx="660" cy="76" r="6.5" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text class="s body" x="44" y="118" font-size="13.5">its output appears in the page</text>
  <circle cx="470" cy="114" r="7" fill="#4C9AFF"/>
  <circle cx="660" cy="114" r="6.5" fill="none" stroke="#475569" stroke-width="1.5"/>
  <rect x="24" y="133" width="802" height="34" rx="6" fill="#1e293b"/>
  <text class="s body" x="44" y="156" font-size="13.5">you get a shareable link</text>
  <circle cx="470" cy="152" r="7" fill="#4C9AFF"/>
  <circle cx="660" cy="152" r="7" fill="#4C9AFF"/>
  <line x1="24" y1="196" x2="826" y2="196" stroke="#334155"/>
  <text class="s lbl muted" x="44" y="222" font-size="11">reach for it when</text>
  <text class="m muted" x="470" y="244" font-size="11.5" text-anchor="middle">your readers should see</text>
  <text class="m muted" x="470" y="260" font-size="11.5" text-anchor="middle">the result, and open it</text>
  <text class="m muted" x="660" y="244" font-size="11.5" text-anchor="middle">the code cannot run here:</text>
  <text class="m muted" x="660" y="260" font-size="11.5" text-anchor="middle">a Shiny app, a slow step,</text>
  <text class="m muted" x="660" y="276" font-size="11.5" text-anchor="middle">a package you lack</text>
  <text class="s faint" x="44" y="314" font-size="12.5">Both are handed the chunk's raw source, so comments reach the link either way.</text>
</svg>
