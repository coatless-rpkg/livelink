  <text class="s lbl ink" x="445.0" y="26" font-size="13">THE ENGINE</text>
  <rect x="445.0" y="44" width="378" height="146" rx="6" fill="#0b1220" stroke="#334155"/>
  <path d="M445.0 44 h378 v22 h-378 z" fill="#131c2e"/>
  <path d="M445.0 66 h378" stroke="#334155"/>
  <text class="m accent" x="453.0" y="59" font-size="9.5" font-weight="700">notes.qmd</text>
  <rect x="459.0" y="78" width="350" height="102" rx="4" fill="#131c2e" stroke="#334155"/>
  <text class="m" x="473.0" y="98" font-size="12" xml:space="preserve"><tspan class="fn">```{livelink}</tspan></text>
  <text class="m" x="473.0" y="116" font-size="12" xml:space="preserve"><tspan class="com">#| engine.target: shinylive-r</tspan></text>
  <text class="m" x="473.0" y="134" font-size="12" xml:space="preserve"><tspan class="fn">library</tspan><tspan class="ink">(shiny)</tspan></text>
