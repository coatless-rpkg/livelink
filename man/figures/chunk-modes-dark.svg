  <text class="m" x="55.0" y="282" font-size="12" xml:space="preserve"><tspan class="fn">data</tspan><tspan class="ink">(mtcars)</tspan></text>
  <text class="m" x="55.0" y="300" font-size="12" xml:space="preserve"><tspan class="fn">plot</tspan><tspan class="ink">(mtcars$mpg, mtcars$wt)</tspan></text>
  <rect x="41.0" y="322" width="350" height="46" rx="4" fill="#0b1220" stroke="#334155"/>
