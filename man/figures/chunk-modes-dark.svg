<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 431" role="img" aria-labelledby="t d">
  <title id="t">The chunk hook and the chunk engine</title>
  <desc id="d">With the hook on an ordinary r chunk, the chunk still runs and its plot appears in the page, with a link beneath. With the engine, the code is shown but never executed, and only a link is produced.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.lbl{letter-spacing:.10em;font-weight:700}.fn{fill:#60a5fa}.str{fill:#34d399}.num{fill:#fbbf24}.com{fill:#64748b}.key{fill:#c4b5fd}.ink{fill:#e2e8f0}.body{fill:#cbd5e1}.muted{fill:#94a3b8}.faint{fill:#64748b}.card{fill:#1e293b}.cardline{fill:#334155}.rail{fill:#475569}.accent{fill:#4C9AFF}.accent_soft{fill:#12315c}.hollow{fill:#475569}.chrome{fill:#172033}.pane{fill:#0b1220}.panehdr{fill:#131c2e}.base{fill:#94a3b8}.base_bg{fill:#273244}.ver{fill:#5eead4}.ver_bg{fill:#12332e}.pan{fill:#c4b5fd}.pan_bg{fill:#2e2450}.frag{fill:#4C9AFF}.frag_bg{fill:#12315c}.flag{fill:#fbbf24}.flag_bg{fill:#3d2f10}.shadow{fill:#000000}</style>
  <text class="s lbl ink" x="27.0" y="26" font-size="13">THE HOOK</text>
  <rect x="27.0" y="44" width="378" height="146" rx="6" fill="#0b1220" stroke="#334155"/>
  <path d="M27.0 44 h378 v22 h-378 z" fill="#131c2e"/>
  <path d="M27.0 66 h378" stroke="#334155"/>
  <text class="m accent" x="35.0" y="59" font-size="9.5" font-weight="700">notes.qmd</text>
  <rect x="41.0" y="78" width="350" height="102" rx="4" fill="#131c2e" stroke="#334155"/>
  <text class="m" x="55.0" y="98" font-size="12" xml:space="preserve"><tspan class="fn">```{r}</tspan></text>
  <text class="m" x="55.0" y="116" font-size="12" xml:space="preserve"><tspan class="com">#| livelink: true</tspan></text>
  <text class="m" x="55.0" y="134" font-size="12" xml:space="preserve"><tspan class="fn">data</tspan><tspan class="ink">(mtcars)</tspan></text>
  <text class="m" x="55.0" y="152" font-size="12" xml:space="preserve"><tspan class="fn">plot</tspan><tspan class="ink">(mtcars$mpg, mtcars$wt)</tspan></text>
  <text class="m" x="55.0" y="170" font-size="12" xml:space="preserve"><tspan class="fn">```</tspan></text>
  <text class="s lbl muted" x="27.0" y="218" font-size="11">IN THE PAGE</text>
  <rect x="27.0" y="228" width="378" height="187" rx="6" fill="#0b1220" stroke="#334155"/>
  <path d="M27.0 228 h378 v22 h-378 z" fill="#131c2e"/>
  <path d="M27.0 250 h378" stroke="#334155"/>
  <text class="m accent" x="35.0" y="243" font-size="9.5" font-weight="700">rendered</text>
  <rect x="41.0" y="262" width="350" height="48" rx="4" fill="#131c2e" stroke="#334155"/>
