<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" role="img" aria-labelledby="t d">
  <title id="t">Multi-file projects in one link</title>
  <desc id="d">A named list or a vector of file paths goes into webr_repl_project and comes out as one URL carrying every file, which webR unpacks into its filesystem.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.lbl{letter-spacing:.10em;font-weight:700}.fn{fill:#2563eb}.str{fill:#047857}.num{fill:#b45309}.com{fill:#94a3b8}.key{fill:#6d28d9}.ink{fill:#0f172a}.body{fill:#334155}.muted{fill:#64748b}.faint{fill:#94a3b8}.card{fill:#f1f5f9}.cardline{fill:#e2e8f0}.rail{fill:#cbd5e1}.accent{fill:#0054AD}.accent_soft{fill:#e0edff}.hollow{fill:#cbd5e1}.base{fill:#475569}.base_bg{fill:#e9edf2}.ver{fill:#0f766e}.ver_bg{fill:#d8f1ee}.pan{fill:#6d28d9}.pan_bg{fill:#ebe3fb}.frag{fill:#0054AD}.frag_bg{fill:#dfeaff}.flag{fill:#b45309}.flag_bg{fill:#fdeccd}</style>
  <defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#0054AD"/></marker></defs>
  <text class="s lbl muted" x="42" y="24" font-size="11">EITHER SHAPE OF INPUT</text>
  <rect x="24" y="38" width="396" height="74" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text class="m" x="40" y="60" font-size="11.5" xml:space="preserve"><tspan class="fn">list</tspan><tspan class="ink">(</tspan><tspan class="str">"main.R"</tspan><tspan class="ink"> = code, </tspan><tspan class="str">"utils.R"</tspan><tspan class="ink"> = helpers)</tspan></text>
  <text class="s faint" x="40" y="78" font-size="11">a named list</text>
  <text class="m" x="40" y="100" font-size="11.5" xml:space="preserve"><tspan class="fn">c</tspan><tspan class="ink">(</tspan><tspan class="str">"main.R"</tspan><tspan class="ink">, </tspan><tspan class="str">"utils.R"</tspan><tspan class="ink">, </tspan><tspan class="str">"data.csv"</tspan><tspan class="ink">)</tspan></text>
  <text class="s faint" x="404" y="100" font-size="11" text-anchor="end">or file paths</text>
  <path d="M428 76 L468 76" stroke="#0054AD" stroke-width="2" marker-end="url(#a)"/>
  <text class="s lbl muted" x="480" y="24" font-size="11">ONE LINK, ALL THE FILES</text>
  <rect x="478" y="38" width="348" height="74" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text class="m" x="494" y="62" font-size="11" xml:space="preserve"><tspan class="fn">webr_repl_project</tspan><tspan class="ink">(</tspan><tspan class="ink">files</tspan><tspan class="ink">, </tspan><tspan class="ink">autorun_files</tspan><tspan class="ink"> = </tspan><tspan class="str">"main.R"</tspan><tspan class="ink">)</tspan></text>
  <text class="m" x="494" y="84" font-size="10.5" xml:space="preserve"><tspan class="ink">https://webr.r-wasm.org/latest/</tspan></text>
  <text class="m" x="494" y="100" font-size="10.5" xml:space="preserve"><tspan class="frag">#code=</tspan><tspan class="frag">eJyLrlbKS8…</tspan><tspan class="flag">&amp;jza</tspan></text>
  <text class="s lbl muted" x="42" y="148" font-size="11">THE FILES LAND IN webR's FILESYSTEM</text>
  <rect x="24" y="162" width="802" height="96" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text class="m" x="44" y="186" font-size="11.5" xml:space="preserve"><tspan class="str">/home/web_user/</tspan></text>
  <text class="m" x="62" y="204" font-size="11.5" xml:space="preserve"><tspan class="ink">main.R</tspan></text>
  <text class="m" x="62" y="222" font-size="11.5" xml:space="preserve"><tspan class="ink">utils.R</tspan></text>
  <text class="m" x="62" y="240" font-size="11.5" xml:space="preserve"><tspan class="ink">data.csv</tspan></text>
  <text class="s faint" x="812" y="186" font-size="11" text-anchor="end">autorun_files runs main.R on arrival</text>
  <text class="s faint" x="812" y="208" font-size="11" text-anchor="end">pass "all" to run every R file</text>
  <text class="s faint" x="42" y="286" font-size="12">The whole project travels in the link. Non-R files -- data, README, CSS -- come along too.</text>
</svg>
