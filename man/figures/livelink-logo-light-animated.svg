<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1732 2000" width="1732" height="2000" role="img" aria-label="livelink">
<title>livelink</title>
<style>
/* THE FOLD -- 7000ms. A page of code is folded down and becomes a link.

     0-8    HOLD      the finished mark, at rest
     8-38   THE FOLD  the accordion loses 40% of its height, top panel first, 70ms
                      apart, and the whole sheet sinks 150 units -- so its top edge falls
                      465.456 and its last two panels go BEHIND the button.
     38-48  THE FORGE the link takes the fold: it gives 2.2% and its border lights.
     48-64  THE LAUNCH the arrow leaves up its own 45-degree shaft and the next one
                      arrives from the down-left. Both ends of the cut are invisible.
     64-90  THE UNFOLD the paper springs open, 1.6% past, and settles.
     90-100 HOLD

   THE BASE STATE IS THE COMPLETE STATIC LOGO. Every track below rests at the value the
   artwork already carries, so rsvg, a PDF, a feed reader and prefers-reduced-motion all
   draw the finished mark. The loop ends where it began -- no jump on repeat.
   THE WORDMARK DOES NOT MOVE. It is the hero, and the one fixed thing in the frame. */
#ll-pnl0,#ll-pnl1,#ll-pnl2,#ll-pnl3,
#ll-lift1,#ll-lift2,#ll-lift3,
#ll-lift1c,#ll-lift2c,#ll-lift3c,
#ll-crease1,#ll-crease2,#ll-crease3{transform-box:fill-box;transform-origin:50% 0%}
#ll-button,#ll-glyph{transform-box:fill-box;transform-origin:50% 50%}

#ll-sheet,#ll-pnl0,#ll-pnl1,#ll-pnl2,#ll-pnl3,
#ll-lift1,#ll-lift2,#ll-lift3,
#ll-lift1c,#ll-lift2c,#ll-lift3c,
#ll-crease1,#ll-crease2,#ll-crease3,
#ll-code0,#ll-code1,#ll-code2,#ll-code3,
#ll-button,#ll-glyph,#ll-arrow{
  animation-duration:7000ms;
  animation-iteration-count:infinite;
  animation-timing-function:linear
}

/* THE FOLD. A fold pulse walks down the sheet, 70ms per panel. The sheet also
   DESCENDS: the button is painted after it, so the paper slides behind the link. */
#ll-sheet{animation-name:ll-sink}
#ll-pnl0{animation-name:ll-fold0}
#ll-pnl1{animation-name:ll-fold1;animation-delay:70ms}
#ll-pnl2{animation-name:ll-fold2;animation-delay:140ms}
#ll-pnl3{animation-name:ll-fold3;animation-delay:210ms}
#ll-lift1,#ll-lift1c{animation-name:ll-drop1;animation-delay:70ms}
#ll-lift2,#ll-lift2c{animation-name:ll-drop2;animation-delay:140ms}
#ll-lift3,#ll-lift3c{animation-name:ll-drop3;animation-delay:210ms}
#ll-crease1{animation-name:ll-crease;animation-delay:70ms}
#ll-crease2{animation-name:ll-crease;animation-delay:140ms}
#ll-crease3{animation-name:ll-crease;animation-delay:210ms}
#ll-code0{animation-name:ll-dim}
#ll-code1{animation-name:ll-dim;animation-delay:70ms}
#ll-code2{animation-name:ll-dim;animation-delay:140ms}
#ll-code3{animation-name:ll-dim;animation-delay:210ms}

/* THE FORGE and THE LAUNCH */
#ll-button{animation-name:ll-press}
#ll-glyph{animation-name:ll-launch}
#ll-arrow{animation-name:ll-fade}
@keyframes ll-fold0{
  0%,8%{transform:translateY(0) scaleY(1);animation-timing-function:cubic-bezier(.62,.02,.24,1)}
  38%,64%{transform:translateY(147.312px) scaleY(.6);animation-timing-function:cubic-bezier(.24,.1,.32,1)}
  82%{transform:translateY(-5.8925px) scaleY(1.016);animation-timing-function:cubic-bezier(.42,0,.3,1)}
  90%,100%{transform:translateY(0) scaleY(1)}
}
@keyframes ll-fold1{
  0%,8%{transform:translateY(0) scaleY(1);animation-timing-function:cubic-bezier(.62,.02,.24,1)}
  38%,64%{transform:translateY(73.656px) scaleY(.6);animation-timing-function:cubic-bezier(.24,.1,.32,1)}
  82%{transform:translateY(-2.9462px) scaleY(1.016);animation-timing-function:cubic-bezier(.42,0,.3,1)}
  90%,100%{transform:translateY(0) scaleY(1)}
}
@keyframes ll-fold2{
  0%,8%{transform:translateY(0) scaleY(1);animation-timing-function:cubic-bezier(.62,.02,.24,1)}
  38%,64%{transform:translateY(52.824px) scaleY(.6);animation-timing-function:cubic-bezier(.24,.1,.32,1)}
  82%{transform:translateY(-2.113px) scaleY(1.016);animation-timing-function:cubic-bezier(.42,0,.3,1)}
  90%,100%{transform:translateY(0) scaleY(1)}
}
@keyframes ll-fold3{
  0%,8%{transform:translateY(0) scaleY(1);animation-timing-function:cubic-bezier(.62,.02,.24,1)}
  38%,64%{transform:translateY(41.664px) scaleY(.6);animation-timing-function:cubic-bezier(.24,.1,.32,1)}
  82%{transform:translateY(-1.6666px) scaleY(1.016);animation-timing-function:cubic-bezier(.42,0,.3,1)}
  90%,100%{transform:translateY(0) scaleY(1)}
}
@keyframes ll-drop1{
  0%,8%{transform:translateY(0);animation-timing-function:cubic-bezier(.62,.02,.24,1)}
  38%,64%{transform:translateY(73.656px);animation-timing-function:cubic-bezier(.24,.1,.32,1)}
  82%{transform:translateY(-2.9462px);animation-timing-function:cubic-bezier(.42,0,.3,1)}
  90%,100%{transform:translateY(0)}
}
@keyframes ll-drop2{
  0%,8%{transform:translateY(0);animation-timing-function:cubic-bezier(.62,.02,.24,1)}
  38%,64%{transform:translateY(52.824px);animation-timing-function:cubic-bezier(.24,.1,.32,1)}
  82%{transform:translateY(-2.113px);animation-timing-function:cubic-bezier(.42,0,.3,1)}
  90%,100%{transform:translateY(0)}
}
@keyframes ll-drop3{
  0%,8%{transform:translateY(0);animation-timing-function:cubic-bezier(.62,.02,.24,1)}
  38%,64%{transform:translateY(41.664px);animation-timing-function:cubic-bezier(.24,.1,.32,1)}
  82%{transform:translateY(-1.6666px);animation-timing-function:cubic-bezier(.42,0,.3,1)}
  90%,100%{transform:translateY(0)}
}
/* A fold line is welded to the fold it draws: same S, same stagger, so the crease
   closes with the panel edge it lies on instead of floating off it. Its bounding box
   starts at its own chord, so scaling about 50% 0% squashes the SAG and leaves the
   chord where the lift groups put it. */
@keyframes ll-crease{
  0%,8%{transform:scaleY(1);animation-timing-function:cubic-bezier(.62,.02,.24,1)}
  38%,64%{transform:scaleY(.6);animation-timing-function:cubic-bezier(.24,.1,.32,1)}
  82%{transform:scaleY(1.016);animation-timing-function:cubic-bezier(.42,0,.3,1)}
  90%,100%{transform:scaleY(1)}
}
/* THE SINK. The sheet does not just shorten, it DESCENDS -- the fold is a page being put
   away. This is the move that makes the panels disappear behind the link. */
@keyframes ll-sink{
  0%,8%{transform:translateY(0);animation-timing-function:cubic-bezier(.62,.02,.24,1)}
  38%,64%{transform:translateY(150px);animation-timing-function:cubic-bezier(.3,.02,.28,1)}
  82%,100%{transform:translateY(0)}
}
@keyframes ll-dim{
  0%,8%{opacity:1;animation-timing-function:cubic-bezier(.62,.02,.24,1)}
  38%,64%{opacity:.4;animation-timing-function:cubic-bezier(.24,.1,.32,1)}
  90%,100%{opacity:1}
}
/* THE FORGE: the sheet has just poured into it, so the link gives, and its border comes
   up and STAYS up until the arrow is home. The link exists now. */
@keyframes ll-press{
  0%,38%{transform:scale(1);stroke:#1D5A96;animation-timing-function:cubic-bezier(.4,0,.2,1)}
  43%{transform:scale(.978);stroke:#4B7EAF;animation-timing-function:cubic-bezier(.3,0,.3,1)}
  50%,64%{transform:scale(1);stroke:#4B7EAF;animation-timing-function:cubic-bezier(.3,0,.3,1)}
  76%,100%{transform:scale(1);stroke:#1D5A96}
}
/* THE LAUNCH: 48.0833 units up the 45-degree shaft the arrow is already drawn on. It is
   cut and re-seeded at the mirrored offset while it is at opacity 0, then decelerates
   back to EXACTLY its base position. No drift, and no jump on repeat. */
@keyframes ll-launch{
  0%,48%{transform:translate(0,0);animation-timing-function:cubic-bezier(.5,0,.85,.15)}
  57%{transform:translate(34px,-34px)}
  57.5%{transform:translate(-34px,34px);animation-timing-function:cubic-bezier(.12,.7,.24,1)}
  66%,100%{transform:translate(0,0)}
}
@keyframes ll-fade{
  0%,52%{opacity:1;animation-timing-function:cubic-bezier(.5,0,.85,.15)}
  57%,57.5%{opacity:0;animation-timing-function:cubic-bezier(.12,.7,.24,1)}
  63%,100%{opacity:1}
}

@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
