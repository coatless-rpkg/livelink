<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 419" role="img" aria-labelledby="t d">
  <title id="t">The chunk hook and the chunk engine</title>
  <desc id="d">With the hook on an ordinary r chunk, the chunk still runs and its plot appears in the page, with a link beneath. With the engine, the code is shown but never executed, and only a link is produced.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.lbl{letter-spacing:.10em;font-weight:700}.fn{fill:#2563eb}.str{fill:#047857}.num{fill:#b45309}.com{fill:#94a3b8}.key{fill:#6d28d9}.ink{fill:#0f172a}.body{fill:#334155}.muted{fill:#64748b}.faint{fill:#94a3b8}.card{fill:#f1f5f9}.cardline{fill:#e2e8f0}.rail{fill:#cbd5e1}.accent{fill:#0054AD}.accent_soft{fill:#e0edff}.hollow{fill:#cbd5e1}.chrome{fill:#e2e8f0}.pane{fill:#ffffff}.panehdr{fill:#f8fafc}.base{fill:#475569}.base_bg{fill:#e9edf2}.ver{fill:#0f766e}.ver_bg{fill:#d8f1ee}.pan{fill:#6d28d9}.pan_bg{fill:#ebe3fb}.frag{fill:#0054AD}.frag_bg{fill:#dfeaff}.flag{fill:#b45309}.flag_bg{fill:#fdeccd}</style>
  <text class="s lbl ink" x="24" y="22" font-size="11">THE HOOK</text>
  <text class="m muted" x="24" y="40" font-size="11.5">on an ordinary r chunk</text>
  <rect x="24" y="54" width="392" height="108" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M24 54 h392 v22 h-392 z" fill="#f8fafc"/>
  <path d="M24 76 h392" stroke="#e2e8f0"/>
  <text class="m accent" x="32" y="69" font-size="9.5" font-weight="700">notes.qmd</text>
  <text class="m" x="36" y="92" font-size="9.5" xml:space="preserve"><tspan class="fn">```{r}</tspan></text>
  <text class="m" x="36" y="106" font-size="9.5" xml:space="preserve"><tspan class="com">#| livelink: true</tspan></text>
  <text class="m" x="36" y="120" font-size="9.5" xml:space="preserve"><tspan class="fn">data</tspan><tspan class="ink">(mtcars)</tspan></text>
  <text class="m" x="36" y="134" font-size="9.5" xml:space="preserve"><tspan class="fn">plot</tspan><tspan class="ink">(mtcars$mpg, mtcars$wt)</tspan></text>
  <text class="m" x="36" y="148" font-size="9.5" xml:space="preserve"><tspan class="fn">```</tspan></text>
  <text class="s lbl muted" x="24" y="182" font-size="10">IN THE PAGE</text>
  <rect x="24" y="192" width="392" height="159" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M24 192 h392 v22 h-392 z" fill="#f8fafc"/>
  <path d="M24 214 h392" stroke="#e2e8f0"/>
  <text class="m accent" x="32" y="207" font-size="9.5" font-weight="700">rendered</text>
  <text class="m" x="36" y="230" font-size="9.5" xml:space="preserve"><tspan class="fn">data</tspan><tspan class="ink">(mtcars)</tspan></text>
  <text class="m" x="36" y="244" font-size="9.5" xml:space="preserve"><tspan class="fn">plot</tspan><tspan class="ink">(mtcars$mpg, mtcars$wt)</tspan></text>
  <rect x="36" y="254" width="368" height="44" rx="4" fill="#f1f5f9"/>
  <path d="M48 260 V290 H392" fill="none" stroke="#94a3b8"/>
  <circle cx="56.0" cy="286.0" r="2" fill="none" stroke="#0054AD" stroke-width="1.2"/>
  <circle cx="97.0" cy="283.5" r="2" fill="none" stroke="#0054AD" stroke-width="1.2"/>
  <circle cx="138.0" cy="281.0" r="2" fill="none" stroke="#0054AD" stroke-width="1.2"/>
  <circle cx="179.0" cy="278.5" r="2" fill="none" stroke="#0054AD" stroke-width="1.2"/>
  <circle cx="220.0" cy="276.0" r="2" fill="none" stroke="#0054AD" stroke-width="1.2"/>
  <circle cx="261.0" cy="273.5" r="2" fill="none" stroke="#0054AD" stroke-width="1.2"/>
  <circle cx="302.0" cy="271.0" r="2" fill="none" stroke="#0054AD" stroke-width="1.2"/>
  <circle cx="343.0" cy="268.5" r="2" fill="none" stroke="#0054AD" stroke-width="1.2"/>
  <circle cx="384.0" cy="266.0" r="2" fill="none" stroke="#0054AD" stroke-width="1.2"/>
  <rect x="36" y="310" width="92.80000000000001" height="19" rx="9.5" fill="#e0edff"/>
  <text class="s accent" x="82.4" y="323" font-size="9.5" font-weight="700" text-anchor="middle">Open in webR</text>
  <text class="s faint" x="24" y="375" font-size="11.5">the chunk runs; you get the plot AND a link</text>
  <text class="s lbl ink" x="458" y="22" font-size="11">THE ENGINE</text>
  <text class="m muted" x="458" y="40" font-size="11.5">as its own chunk type</text>
  <rect x="458" y="54" width="392" height="108" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M458 54 h392 v22 h-392 z" fill="#f8fafc"/>
  <path d="M458 76 h392" stroke="#e2e8f0"/>
  <text class="m accent" x="466" y="69" font-size="9.5" font-weight="700">notes.qmd</text>
  <text class="m" x="470" y="92" font-size="9.5" xml:space="preserve"><tspan class="fn">```{livelink}</tspan></text>
  <text class="m" x="470" y="106" font-size="9.5" xml:space="preserve"><tspan class="com">#| engine.target: shinylive-r</tspan></text>
  <text class="m" x="470" y="120" font-size="9.5" xml:space="preserve"><tspan class="fn">library</tspan><tspan class="ink">(shiny)</tspan></text>
  <text class="m" x="470" y="134" font-size="9.5" xml:space="preserve"><tspan class="fn">shinyApp</tspan><tspan class="ink">(ui, server)</tspan></text>
  <text class="m" x="470" y="148" font-size="9.5" xml:space="preserve"><tspan class="fn">```</tspan></text>
  <text class="s lbl muted" x="458" y="182" font-size="10">IN THE PAGE</text>
  <rect x="458" y="192" width="392" height="159" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M458 192 h392 v22 h-392 z" fill="#f8fafc"/>
  <path d="M458 214 h392" stroke="#e2e8f0"/>
  <text class="m accent" x="466" y="207" font-size="9.5" font-weight="700">rendered</text>
  <text class="m" x="470" y="230" font-size="9.5" xml:space="preserve"><tspan class="fn">library</tspan><tspan class="ink">(shiny)</tspan></text>
  <text class="m" x="470" y="244" font-size="9.5" xml:space="preserve"><tspan class="fn">shinyApp</tspan><tspan class="ink">(ui, server)</tspan></text>
  <rect x="470" y="252" width="368" height="18" rx="4" fill="#f1f5f9"/>
  <text class="m faint" x="478" y="265" font-size="9.5">(not executed)</text>
  <rect x="470" y="288" width="122.30000000000001" height="19" rx="9.5" fill="#e0edff"/>
  <text class="s accent" x="531.15" y="301" font-size="9.5" font-weight="700" text-anchor="middle">Open in Shinylive</text>
  <text class="s faint" x="458" y="375" font-size="11.5">nothing runs; you get the code and a link</text>
  <text class="s faint" x="24" y="405" font-size="12">Both are handed the chunk's raw source, so comments reach the link either way.</text>
</svg>
