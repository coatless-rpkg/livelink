  <text class="s faint" x="458" y="362" font-size="11.5">the running app alone, for the people using it</text>
  <text class="s faint" x="24" y="388" font-size="12">header = FALSE drops the Shinylive header in app mode, for embedding in a page. In editor mode there is none to drop.</text>
