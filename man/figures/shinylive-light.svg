  <text class="m" x="40" y="256" font-size="9.5" xml:space="preserve"><tspan class="ink">ui </tspan><tspan class="ink">&lt;- </tspan><tspan class="fn">fluidPage</tspan><tspan class="ink">(…)</tspan></text>
  <text class="m" x="40" y="270" font-size="9.5" xml:space="preserve"><tspan class="ink">server </tspan><tspan class="ink">&lt;- </tspan><tspan class="fn">function</tspan><tspan class="ink">(…)</tspan></text>
  <text class="m" x="40" y="284" font-size="9.5" xml:space="preserve"><tspan class="fn">shinyApp</tspan><tspan class="ink">(ui, server)</tspan></text>
