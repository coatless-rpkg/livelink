<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" role="img" aria-labelledby="t d">
  <title id="t">Share R code as a link that opens a live R session</title>
  <desc id="d">R code goes into webr_repl_link, comes out as one URL, and opening that URL gives the recipient a running webR session with the code in the editor and the plot drawn.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.lbl{letter-spacing:.10em;font-weight:700}.fn{fill:#60a5fa}.str{fill:#34d399}.num{fill:#fbbf24}.com{fill:#64748b}.key{fill:#c4b5fd}.ink{fill:#e2e8f0}.body{fill:#cbd5e1}.muted{fill:#94a3b8}.faint{fill:#64748b}.card{fill:#1e293b}.cardline{fill:#334155}.rail{fill:#475569}.accent{fill:#4C9AFF}.accent_soft{fill:#12315c}.hollow{fill:#475569}.chrome{fill:#172033}.pane{fill:#0b1220}.panehdr{fill:#131c2e}.base{fill:#94a3b8}.base_bg{fill:#273244}.ver{fill:#5eead4}.ver_bg{fill:#12332e}.pan{fill:#c4b5fd}.pan_bg{fill:#2e2450}.frag{fill:#4C9AFF}.frag_bg{fill:#12315c}.flag{fill:#fbbf24}.flag_bg{fill:#3d2f10}</style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#4C9AFF"/></marker></defs>
  <circle cx="32" cy="18" r="9" fill="#4C9AFF"/>
  <text class="s" fill="#0b1220" x="32" y="22" font-size="10.5" font-weight="700" text-anchor="middle">1</text>
  <text class="s lbl ink" x="48" y="22" font-size="11">YOU WRITE R</text>
  <circle cx="294" cy="18" r="9" fill="#4C9AFF"/>
  <text class="s" fill="#0b1220" x="294" y="22" font-size="10.5" font-weight="700" text-anchor="middle">2</text>
  <text class="s lbl ink" x="310" y="22" font-size="11">YOU GET A URL</text>
  <circle cx="556" cy="18" r="9" fill="#4C9AFF"/>
  <text class="s" fill="#0b1220" x="556" y="22" font-size="10.5" font-weight="700" text-anchor="middle">3</text>
  <text class="s lbl ink" x="572" y="22" font-size="11">THEY GET A LIVE R SESSION</text>
  <rect x="24" y="44" width="222" height="150" rx="8" fill="#1e293b" stroke="#334155"/>
  <text class="m" x="40" y="72" font-size="11" xml:space="preserve"><tspan class="fn">webr_repl_link</tspan><tspan class="ink">({</tspan></text>
  <text class="m" x="40" y="89" font-size="11" xml:space="preserve"><tspan class="fn">  data</tspan><tspan class="ink">(mtcars)</tspan></text>
  <text class="m" x="40" y="106" font-size="11" xml:space="preserve"><tspan class="fn">  plot</tspan><tspan class="ink">(mtcars$mpg,</tspan></text>
  <text class="m" x="40" y="123" font-size="11" xml:space="preserve"><tspan class="ink">       mtcars$wt)</tspan></text>
  <text class="m" x="40" y="140" font-size="11" xml:space="preserve"><tspan class="ink">})</tspan></text>
  <text class="s faint" x="40" y="178" font-size="10.5">no quotes, no escaping</text>
  <path d="M254 119.0 H278" stroke="#4C9AFF" stroke-width="2" marker-end="url(#a)"/>
  <rect x="286" y="44" width="222" height="150" rx="8" fill="#1e293b" stroke="#334155"/>
  <text class="m" x="302" y="76" font-size="10.5" xml:space="preserve"><tspan class="ink">https://</tspan></text>
  <text class="m" x="302" y="92" font-size="10.5" xml:space="preserve"><tspan class="ink">webr.r-wasm.org/latest/</tspan></text>
  <text class="m" x="302" y="112" font-size="10.5" xml:space="preserve"><tspan class="frag">#code=</tspan></text>
  <text class="m" x="302" y="128" font-size="10.5" xml:space="preserve"><tspan class="frag">eJyLrlbKS8xNVbJSKk4u</tspan></text>
  <text class="m" x="302" y="143" font-size="10.5" xml:space="preserve"><tspan class="frag">yiwo0QtS0lEqSCzJAIro</tspan></text>
  <text class="m" x="302" y="158" font-size="10.5" xml:space="preserve"><tspan class="flag">&amp;jz</tspan></text>
  <text class="s faint" x="302" y="178" font-size="10.5">the code IS the link</text>
  <path d="M516 119.0 H540" stroke="#4C9AFF" stroke-width="2" marker-end="url(#a)"/>
  <rect x="548" y="44" width="278" height="150" rx="8" fill="#172033" stroke="#334155"/>
  <path d="M548 66 h278" stroke="#334155"/>
  <circle cx="560" cy="55" r="3" fill="#475569"/>
  <circle cx="570" cy="55" r="3" fill="#475569"/>
  <circle cx="580" cy="55" r="3" fill="#475569"/>
  <text class="m faint" x="596" y="59" font-size="8.5">webr.r-wasm.org/latest/</text>
  <rect x="555" y="73" width="128.5" height="53.5" rx="4" fill="#0b1220" stroke="#334155"/>
  <text class="m accent" x="562" y="86" font-size="8.5" font-weight="700">editor</text>
  <text class="m" x="562" y="100" font-size="8" xml:space="preserve"><tspan class="fn">data</tspan><tspan class="ink">(mtcars)</tspan></text>
  <text class="m" x="562" y="111" font-size="8" xml:space="preserve"><tspan class="fn">plot</tspan><tspan class="ink">(...)</tspan></text>
  <rect x="690.5" y="73" width="128.5" height="53.5" rx="4" fill="#0b1220" stroke="#334155"/>
  <text class="m accent" x="697.5" y="86" font-size="8.5" font-weight="700">files</text>
  <text class="m" x="697.5" y="100" font-size="8" xml:space="preserve"><tspan class="str">script.R</tspan></text>
  <rect x="555" y="133.5" width="128.5" height="53.5" rx="4" fill="#0b1220" stroke="#334155"/>
  <text class="m accent" x="562" y="146.5" font-size="8.5" font-weight="700">terminal</text>
  <text class="m" x="562" y="160.5" font-size="8" xml:space="preserve"><tspan class="com">&gt; </tspan><tspan class="fn">source</tspan><tspan class="ink">(...)</tspan></text>
  <rect x="690.5" y="133.5" width="128.5" height="53.5" rx="4" fill="#0b1220" stroke="#334155"/>
  <text class="m accent" x="697.5" y="146.5" font-size="8.5" font-weight="700">plot</text>
  <path d="M702.5 153.5 V177.0 H809.0" fill="none" stroke="#64748b" stroke-width="0.8"/>
  <circle cx="707.5" cy="171.7" r="1.8" fill="none" stroke="#4C9AFF" stroke-width="1"/>
  <circle cx="721.3" cy="168.6" r="1.8" fill="none" stroke="#4C9AFF" stroke-width="1"/>
  <circle cx="735.1" cy="169.7" r="1.8" fill="none" stroke="#4C9AFF" stroke-width="1"/>
  <circle cx="748.9" cy="165.5" r="1.8" fill="none" stroke="#4C9AFF" stroke-width="1"/>
  <circle cx="762.6" cy="166.6" r="1.8" fill="none" stroke="#4C9AFF" stroke-width="1"/>
  <circle cx="776.4" cy="162.8" r="1.8" fill="none" stroke="#4C9AFF" stroke-width="1"/>
  <circle cx="790.2" cy="164.4" r="1.8" fill="none" stroke="#4C9AFF" stroke-width="1"/>
  <circle cx="804.0" cy="160.4" r="1.8" fill="none" stroke="#4C9AFF" stroke-width="1"/>
  <text class="s faint" x="24" y="226" font-size="12">Nothing is uploaded. Everything after the # is a URL fragment, which browsers never send to a server.</text>
</svg>
