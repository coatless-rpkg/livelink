  <circle cx="410" cy="18" r="9" fill="#4C9AFF"/>
  <text class="s" fill="#0b1220" x="410" y="22" font-size="10.5" font-weight="700" text-anchor="middle">3</text>
  <text class="s lbl ink" x="426" y="22" font-size="11">THEY GET A LIVE R SESSION</text>
  <rect x="24" y="44" width="176" height="176" rx="8" fill="#1e293b" stroke="#334155"/>
  <text class="m" x="40" y="71" font-size="10" xml:space="preserve"><tspan class="fn">webr_repl_link</tspan><tspan class="ink">({</tspan></text>
  <text class="m" x="40" y="87" font-size="10" xml:space="preserve"><tspan class="com">  # mpg vs weight</tspan></text>
  <text class="m" x="40" y="103" font-size="10" xml:space="preserve"><tspan class="fn">  data</tspan><tspan class="ink">(mtcars)</tspan></text>
  <text class="m" x="40" y="119" font-size="10" xml:space="preserve"><tspan class="ink"></tspan></text>
  <text class="m" x="40" y="135" font-size="10" xml:space="preserve"><tspan class="fn">  plot</tspan><tspan class="ink">(mtcars$mpg,</tspan></text>
  <text class="m" x="40" y="151" font-size="10" xml:space="preserve"><tspan class="ink">       mtcars$wt,</tspan></text>
  <text class="m" x="40" y="167" font-size="10" xml:space="preserve"><tspan class="ink">       pch</tspan><tspan class="ink"> = </tspan><tspan class="num">16</tspan><tspan class="ink">,</tspan></text>
  <text class="m" x="40" y="183" font-size="10" xml:space="preserve"><tspan class="ink">       col</tspan><tspan class="ink"> = </tspan><tspan class="str">"steelblue"</tspan><tspan class="ink">)</tspan></text>
  <text class="m" x="40" y="199" font-size="10" xml:space="preserve"><tspan class="ink">})</tspan></text>
  <text class="s faint" x="26" y="242" font-size="11">A string, a file path, or the</text>
  <text class="s faint" x="26" y="258" font-size="11">clipboard work too.</text>
