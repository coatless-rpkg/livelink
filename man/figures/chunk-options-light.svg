<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 472" role="img" aria-labelledby="t d">
  <title id="t">What each chunk option does to the link</title>
  <desc id="d">A table mapping livelink's knitr chunk options to the part of the URL each one changes, and what that means for the reader.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.lbl{letter-spacing:.10em;font-weight:700}.fn{fill:#2563eb}.str{fill:#047857}.num{fill:#b45309}.com{fill:#94a3b8}.key{fill:#6d28d9}.ink{fill:#0f172a}.body{fill:#334155}.muted{fill:#64748b}.faint{fill:#94a3b8}.card{fill:#f1f5f9}.cardline{fill:#e2e8f0}.rail{fill:#cbd5e1}.accent{fill:#0054AD}.accent_soft{fill:#e0edff}.hollow{fill:#cbd5e1}.chrome{fill:#e2e8f0}.pane{fill:#ffffff}.panehdr{fill:#f8fafc}.base{fill:#475569}.base_bg{fill:#e9edf2}.ver{fill:#0f766e}.ver_bg{fill:#d8f1ee}.pan{fill:#6d28d9}.pan_bg{fill:#ebe3fb}.frag{fill:#0054AD}.frag_bg{fill:#dfeaff}.flag{fill:#b45309}.flag_bg{fill:#fdeccd}</style>
  <rect x="24" y="40" width="802" height="370" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M24 52 q0 -12 12 -12 h778 q12 0 12 12 v18 h-802 z" fill="#f8fafc"/>
  <line x1="24" y1="70" x2="826" y2="70" stroke="#e2e8f0"/>
  <text class="s lbl muted" x="40" y="60" font-size="10.5">CHUNK OPTION</text>
  <text class="s lbl muted" x="300" y="60" font-size="10.5">IN THE LINK</text>
  <text class="s lbl muted" x="548" y="60" font-size="10.5">WHAT IT MEANS</text>
  <text class="m" x="40" y="90" font-size="11" xml:space="preserve"><tspan class="ink">livelink</tspan><tspan class="ink">: </tspan><tspan class="num">true</tspan></text>
  <text class="m" x="300" y="90" font-size="11" xml:space="preserve"><tspan class="ink">webr.r-wasm.org/…</tspan></text>
  <text class="s muted" x="548" y="90" font-size="11.5">hook: opens a webR link</text>
  <rect x="25" y="100" width="800" height="30" fill="#f1f5f9"/>
  <text class="m" x="40" y="120" font-size="11" xml:space="preserve"><tspan class="ink">livelink</tspan><tspan class="ink">: </tspan><tspan class="str">shinylive-r</tspan></text>
  <text class="m" x="300" y="120" font-size="11" xml:space="preserve"><tspan class="ink">shinylive.io/r/…</tspan></text>
  <text class="s muted" x="548" y="120" font-size="11.5">hook: a Shiny app instead</text>
  <text class="m" x="40" y="150" font-size="11" xml:space="preserve"><tspan class="ink">engine.target</tspan><tspan class="ink">: </tspan><tspan class="str">shinylive-r</tspan></text>
  <text class="m" x="300" y="150" font-size="11" xml:space="preserve"><tspan class="ink">shinylive.io/r/…</tspan></text>
  <text class="s muted" x="548" y="150" font-size="11.5">engine only: a Shiny app link</text>
  <rect x="25" y="160" width="800" height="30" fill="#f1f5f9"/>
  <text class="m" x="40" y="180" font-size="11" xml:space="preserve"><tspan class="ink">autorun</tspan><tspan class="ink">: </tspan><tspan class="num">true</tspan></text>
  <text class="m" x="300" y="180" font-size="11" xml:space="preserve"><tspan class="ink">&amp;jz</tspan><tspan class="flag">a</tspan></text>
  <text class="s muted" x="548" y="180" font-size="11.5">webR: run the moment it opens</text>
  <text class="m" x="40" y="210" font-size="11" xml:space="preserve"><tspan class="ink">panels</tspan><tspan class="ink">: </tspan><tspan class="str">["editor", "plot"]</tspan></text>
  <text class="m" x="300" y="210" font-size="11" xml:space="preserve"><tspan class="ink">?mode=</tspan><tspan class="pan">'editor-plot'</tspan></text>
  <text class="s muted" x="548" y="210" font-size="11.5">webR: which panels appear</text>
  <rect x="25" y="220" width="800" height="30" fill="#f1f5f9"/>
  <text class="m" x="40" y="240" font-size="11" xml:space="preserve"><tspan class="ink">mode</tspan><tspan class="ink">: </tspan><tspan class="str">app</tspan></text>
  <text class="m" x="300" y="240" font-size="11" xml:space="preserve"><tspan class="ink">shinylive.io/r/</tspan><tspan class="ver">app</tspan><tspan class="ink">/</tspan></text>
  <text class="s muted" x="548" y="240" font-size="11.5">Shinylive: the app, not the code</text>
  <text class="m" x="40" y="270" font-size="11" xml:space="preserve"><tspan class="ink">filename</tspan><tspan class="ink">: </tspan><tspan class="str">analysis.R</tspan></text>
  <text class="m" x="300" y="270" font-size="11" xml:space="preserve"><tspan class="str">analysis.R</tspan></text>
  <text class="s muted" x="548" y="270" font-size="11.5">the file's name inside</text>
  <rect x="25" y="280" width="800" height="30" fill="#f1f5f9"/>
  <text class="m" x="40" y="300" font-size="11" xml:space="preserve"><tspan class="ink">link.text</tspan><tspan class="ink">: </tspan><tspan class="str">"Try it"</tspan></text>
  <text class="m" x="300" y="300" font-size="11" xml:space="preserve"><tspan class="ink">[Try it](…)</tspan></text>
  <text class="s muted" x="548" y="300" font-size="11.5">the words the reader clicks</text>
  <text class="m" x="40" y="330" font-size="11" xml:space="preserve"><tspan class="ink">link.only</tspan><tspan class="ink">: </tspan><tspan class="num">true</tspan></text>
  <text class="m" x="300" y="330" font-size="11" xml:space="preserve"><tspan class="com">(source hidden)</tspan></text>
  <text class="s muted" x="548" y="330" font-size="11.5">engine only: link, no code</text>
  <rect x="25" y="340" width="800" height="30" fill="#f1f5f9"/>
  <text class="m" x="40" y="360" font-size="11" xml:space="preserve"><tspan class="ink">echo</tspan><tspan class="ink">: </tspan><tspan class="num">false</tspan></text>
  <text class="m" x="300" y="360" font-size="11" xml:space="preserve"><tspan class="com">(no change)</tspan></text>
  <text class="s muted" x="548" y="360" font-size="11.5">hides code; link still works</text>
  <line x1="288" y1="70" x2="288" y2="370" stroke="#cbd5e1" stroke-opacity="0.5"/>
  <line x1="536" y1="70" x2="536" y2="370" stroke="#cbd5e1" stroke-opacity="0.5"/>
  <line x1="24" y1="370" x2="826" y2="370" stroke="#e2e8f0"/>
  <circle cx="43" cy="390" r="7" fill="#e0edff"/>
  <text class="s accent" x="43" y="393.5" font-size="10" font-weight="700" text-anchor="middle">i</text>
  <text class="s faint" x="59" y="394" font-size="11.5">No {shinylive-r} chunk: reach Shinylive with engine.target on a {livelink} chunk.</text>
  <text class="m" x="24" y="436" font-size="12" xml:space="preserve"><tspan class="fn">knitr</tspan><tspan class="ink">::</tspan><tspan class="fn">opts_chunk</tspan><tspan class="ink">$set(</tspan><tspan class="ink">livelink</tspan><tspan class="ink"> = </tspan><tspan class="num">TRUE</tspan><tspan class="ink">, </tspan><tspan class="ink">autorun</tspan><tspan class="ink"> = </tspan><tspan class="num">TRUE</tspan><tspan class="ink">)</tspan></text>
  <text class="s faint" x="24" y="458" font-size="12">Set them once for the whole document, and opt a chunk out with livelink: false.</text>
</svg>
