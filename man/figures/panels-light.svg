  <rect x="722.0" y="58.0" width="118.0" height="29.0" rx="4" fill="#e0edff" stroke="#0054AD" stroke-dasharray=""/>
  <text class="m accent" x="781.0" y="75.5" font-size="9" font-weight="700" text-anchor="middle">files</text>
  <rect x="598.0" y="89.0" width="118.0" height="29.0" rx="4" fill="#e0edff" stroke="#0054AD" stroke-dasharray=""/>
  <text class="m accent" x="657.0" y="106.5" font-size="9" font-weight="700" text-anchor="middle">terminal</text>
  <rect x="722.0" y="89.0" width="118.0" height="29.0" rx="4" fill="#e0edff" stroke="#0054AD" stroke-dasharray=""/>
  <text class="m accent" x="781.0" y="106.5" font-size="9" font-weight="700" text-anchor="middle">plot</text>
  <text class="m muted" x="592" y="144" font-size="11.5">no ?mode= at all</text>
  <text class="s faint" x="24" y="170" font-size="12">Panel names are hyphen-joined into the query string. Omit panels and webR shows all four.</text>
