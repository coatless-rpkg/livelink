  <text class="m muted" x="592" y="22" font-size="11.5">panels =</text>
  <text class="m" x="654" y="22" font-size="11.5" xml:space="preserve"><tspan class="num">NULL</tspan><tspan class="com">  (the default)</tspan></text>
  <rect x="592" y="36" width="254" height="86" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <path d="M592 52 h254" stroke="#e2e8f0"/>
  <circle cx="602" cy="44" r="2.2" fill="#cbd5e1"/>
