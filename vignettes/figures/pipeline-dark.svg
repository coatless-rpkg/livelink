<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 424" role="img" aria-labelledby="t d">
  <title id="t">How livelink turns R code into a URL</title>
  <desc id="d">R code is serialized to JSON, gzipped, base64 encoded and placed in the fragment of a webR URL.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.lbl{letter-spacing:.10em;font-weight:700}.ink{fill:#e2e8f0}.body{fill:#cbd5e1}.muted{fill:#94a3b8}.faint{fill:#64748b}.card{fill:#1e293b}.cardline{fill:#334155}.rail{fill:#475569}.accent{fill:#4C9AFF}.accent_soft{fill:#12315c}.hollow{fill:#475569}</style>
  <line x1="26" y1="42" x2="26" y2="322" stroke="#475569" stroke-width="2"/>
  <circle cx="26" cy="42" r="5" fill="#475569"/>
  <text class="s lbl ink" x="46" y="40" font-size="11">YOUR CODE</text>
  <text class="m muted" x="46" y="60" font-size="12">the braced expression</text>
  <rect x="250" y="22" width="570" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
  <text class="m ink" x="266" y="44" font-size="13">{ plot(1:10) }</text>
  <circle cx="26" cy="108" r="5" fill="#475569"/>
  <text class="s lbl ink" x="46" y="106" font-size="11">SERIALIZE</text>
  <text class="m muted" x="46" y="126" font-size="12">jsonlite::toJSON()</text>
  <rect x="250" y="88" width="570" height="56" rx="8" fill="#1e293b" stroke="#334155"/>
  <text class="m ink" x="266" y="110" font-size="13">[{"name":"script.R","path":"/home/web_user/script.R",</text>
  <text class="m muted" x="266" y="132" font-size="12">"text":"plot(1:10)"}]</text>
  <text class="s faint" x="804" y="132" font-size="12" text-anchor="end">74 characters</text>
  <circle cx="26" cy="190" r="5" fill="#475569"/>
  <text class="s lbl ink" x="46" y="188" font-size="11">COMPRESS</text>
  <text class="m muted" x="46" y="208" font-size="12">memCompress("gzip")</text>
  <rect x="250" y="170" width="570" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
  <text class="m ink" x="266" y="192" font-size="13">78 9c 8b ae 56 ca 4b cc 4d 55 …</text>
  <text class="s faint" x="804" y="192" font-size="12" text-anchor="end">71 raw bytes</text>
  <circle cx="26" cy="256" r="5" fill="#475569"/>
  <text class="s lbl ink" x="46" y="254" font-size="11">ENCODE</text>
  <text class="m muted" x="46" y="274" font-size="12">base64enc + URLencode</text>
  <rect x="250" y="236" width="570" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
  <text class="m ink" x="266" y="258" font-size="13">eJyLrlbKS8xNVbJSKk4uyiwo0QtS0lEqSCzJAIro…</text>
  <circle cx="26" cy="322" r="5" fill="#4C9AFF"/>
  <text class="s lbl ink" x="46" y="320" font-size="11">THE LINK</text>
  <text class="m muted" x="46" y="340" font-size="12">webr_repl_link()</text>
  <rect x="250" y="302" width="570" height="56" rx="8" fill="#1e293b" stroke="#334155"/>
  <text class="m accent" x="266" y="324" font-size="13">https://webr.r-wasm.org/latest/</text>
  <text class="m muted" x="266" y="346" font-size="12">#code=eJyLrlbKS8xNVbJS…&amp;jz</text>
  <text class="s faint" x="46" y="414" font-size="12">Everything after the # is a URL fragment. Browsers never send it to a server.</text>
</svg>
